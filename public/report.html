<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>friDay CRM — 回報</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header -->
<header class="h-14 bg-blue-600 flex items-center px-4 text-white shadow-md sticky top-0 z-10">
  <button onclick="history.back()" class="mr-3 p-1 rounded-lg hover:bg-white/20">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
    </svg>
  </button>
  <span class="font-bold text-lg">餐廳回報</span>
</header>

<div class="max-w-lg mx-auto p-4 pb-10">
  <!-- Restaurant info card -->
  <div class="bg-white rounded-2xl shadow-sm p-4 mb-4">
    <p class="text-xs text-gray-400 mb-1">回報餐廳</p>
    <h2 id="restaurantName" class="text-xl font-bold text-gray-800">—</h2>
    <p id="restaurantAddress" class="text-sm text-gray-500 mt-0.5"></p>
  </div>

  <!-- Previous report -->
  <div id="prevReport" class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4 mb-4 hidden">
    <p class="text-xs font-semibold text-yellow-700 mb-1">上次回報摘要</p>
    <p id="prevStatus" class="text-sm font-medium text-gray-700"></p>
    <p id="prevNotes" class="text-sm text-gray-600 mt-1"></p>
    <p id="prevDate" class="text-xs text-gray-400 mt-1"></p>
  </div>

  <!-- Report form -->
  <form id="reportForm" class="bg-white rounded-2xl shadow-sm p-5 space-y-5">
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">聯繫人姓名</label>
      <input id="contact_name" type="text" placeholder="王先生 / 李小姐"
        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">聯繫人電話</label>
      <input id="contact_phone" type="tel" placeholder="0912-345-678"
        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">拜訪狀態 <span class="text-red-500">*</span></label>
      <select id="status" required
        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white">
        <option value="">請選擇狀態</option>
        <option value="not_visited">未拜訪</option>
        <option value="visited_interested">已拜訪 — 有興趣</option>
        <option value="visited_not_interested">已拜訪 — 無興趣</option>
        <option value="follow_up">待追蹤</option>
        <option value="closed_won">✅ 已簽約</option>
        <option value="closed_lost">❌ 未成交</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">備註</label>
      <textarea id="notes" rows="4" placeholder="本次拜訪的重點、客戶反應、後續行動…"
        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></textarea>
    </div>

    <!-- Photo upload -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">現場照片</label>
      <label for="photo" class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-6 cursor-pointer hover:border-blue-400 transition-colors">
        <span class="text-3xl mb-2">📷</span>
        <span class="text-sm text-gray-500">點擊拍照或選擇圖片</span>
      </label>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
      <img id="photoPreview" class="mt-3 rounded-xl w-full object-cover max-h-52 hidden" alt="預覽">
    </div>

    <p id="errorMsg" class="text-red-500 text-sm hidden"></p>

    <button type="submit" id="submitBtn"
      class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-4 rounded-xl text-base transition-colors">
      提交回報
    </button>
  </form>
</div>

<script>
  if (!requireLogin('rep')) throw new Error('redirect');

  const restaurant = JSON.parse(sessionStorage.getItem('selected_restaurant') || 'null');
  if (!restaurant) { location.href = '/map.html'; throw new Error('no restaurant'); }

  document.getElementById('restaurantName').textContent = restaurant.name;
  document.getElementById('restaurantAddress').textContent = restaurant.address || '';

  // Photo preview
  document.getElementById('photo').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const preview = document.getElementById('photoPreview');
    preview.src = URL.createObjectURL(file);
    preview.classList.remove('hidden');
  });

  // Load previous report
  apiFetch(`/api/reports/restaurant/${restaurant.id}`).then(async r => {
    const reports = await r.json();
    if (reports.length > 0) {
      const last = reports[0];
      const statusMap = {
        not_visited:'未拜訪', visited_interested:'有興趣',
        visited_not_interested:'無興趣', follow_up:'待追蹤',
        closed_won:'已簽約', closed_lost:'未成交'
      };
      document.getElementById('prevStatus').textContent = `狀態：${statusMap[last.status] || last.status}`;
      document.getElementById('prevNotes').textContent = last.notes || '（無備註）';
      document.getElementById('prevDate').textContent = last.visited_at?.slice(0,10);
      document.getElementById('prevReport').classList.remove('hidden');

      // Pre-select same status
      document.getElementById('status').value = last.status;
    }
  });

  document.getElementById('reportForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    const status = document.getElementById('status').value;
    if (!status) { err.textContent = '請選擇拜訪狀態'; err.classList.remove('hidden'); return; }

    btn.disabled = true; btn.textContent = '提交中...';
    err.classList.add('hidden');

    const fd = new FormData();
    fd.append('restaurant_id', restaurant.id);
    fd.append('contact_name', document.getElementById('contact_name').value);
    fd.append('contact_phone', document.getElementById('contact_phone').value);
    fd.append('status', status);
    fd.append('notes', document.getElementById('notes').value);
    const photoFile = document.getElementById('photo').files[0];
    if (photoFile) fd.append('photo', photoFile);

    const res = await apiFetch('/api/reports', { method: 'POST', body: fd });
    if (res?.ok) {
      sessionStorage.removeItem('selected_restaurant');
      location.href = '/map.html';
    } else {
      const data = await res?.json();
      err.textContent = data?.error || '提交失敗，請再試一次';
      err.classList.remove('hidden');
      btn.disabled = false; btn.textContent = '提交回報';
    }
  });
</script>
</body>
</html>
